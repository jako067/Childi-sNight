<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Childi's Night - Login</title>
  <link rel="stylesheet" href="styles/index.css" />
  <script src="js/index.js" defer></script>
</head>
<body>
  <main class="center-wrap">
    <h1>Bienvenido a Childi's Night</h1>

    <form class="login-form" action="welcome.html" method="get" id="form">
      <label for="user">Usuario</label>
      <input id="user" name="user" type="text" class="user" placeholder="Tu usuario" />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" class="user" placeholder="••••••••" />

      <button type="submit" class="btn" id="btn">Entrar</button>
    </form> 
  </main>
</body>
</html>
